<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            background-color: aliceblue;
        }
        .card {
            align-items: center;
            border: 5px solid orange;
            border-radius: 30px;
            border-width: 10px;
            padding: 20px;
            width: 300px;
            height: 320px;
            margin-top: 300px;
            margin-left: auto;
            margin-right: auto;
            background-color: beige;
            box-shadow: 10px 10px 5px rgb(189, 189, 189);
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50px;
            margin-left: 75px;
        }
        h2 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        p {
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background-color: #59aaf7;
            color: rgb(255, 255, 255);
            border-radius: 50px;
            border-width: 0px;
            margin-left: 95px;
        }
        button:hover {
            background-color: #0870d1;
            transition: 0.3s;
        }
        .card:hover {
            scale: 110%;
            transition: 0.4s;
            box-shadow: 15px 15px 7px rgb(189, 189, 189);
        }
    </style>
    <body>
        <div class="card">
        <img src="https://i.natgeofe.com/k/093c14b4-978e-41f7-b1aa-3aff5d1c608a/gray-wolf-closeup_3x4.jpg" alt="gray-wolf-closeup_3x4">
        <h2>Dalton Pavesi</h2>
        <p>Habitante da internet</p>
        <button>Seguir</button>
        </div>
    </body>
</html>
